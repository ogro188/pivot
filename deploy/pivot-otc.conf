# Integracion OTC en el PIVOT del leelbox (fase 2).
# El runtime lee la SQLite del collector en modo read-only.
[Service]
Environment=IQ_PUBLIC_DB=/opt/pivot/pivotradar_data/iq_public/iq_public.db
Environment=IQ_PUBLIC_RUNTIME_POLL=5
Environment=IQ_PUBLIC_ENGINE_DATA_DIR=/opt/pivot/pivotradar_data
# Señales OTC: cada activo usa su topic y servidor del JSON (ntfy local).
# Este env queda como fallback para activos sin ntfy.topic propio.
Environment=IQ_PUBLIC_SIGNALS_NTFY_TOPIC=
Environment=IQ_PUBLIC_SIGNALS_NTFY_SERVER=http://127.0.0.1:8081
